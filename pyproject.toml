[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "petsafe-smart-feed"
version = "0.0.1"
description = "Viam module for PetSafe Smart Feed automatic pet feeders."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "viam-sdk>=0.30",
    "petsafe-api>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.setuptools]
packages = ["src", "src.models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
